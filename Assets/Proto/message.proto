syntax = "proto3";
package msg;

// 用户注册
message c2s_user_register {
  string user_name = 1;
}

message s2c_user_register {
  int64 account_id = 1;
  string user_name = 2;
}

// 用户登陆
message c2s_user_login {
  int64 account_id = 1; //用户id
}

///  用户登陆
message s2c_user_login {
  int64 account_id = 1;  ///用户id
  string user_name = 2;  ///用户名字
}

/// 读取配置
message c2s_config {
  string config_name = 1; ///配置名
}

/// 返回配置
message s2c_config {
  string content = 1;   ///配置内容，前端解析
  repeated string list = 2;//配置名字列表
  repeated map_p list2 = 3;//配置map
}

message map_p {
  int32 key = 1;
  int32 val = 2;
}

/// 统一的错误返回
message s2c_error {
  int32 code = 1; ///错误码，0表示无错误
  string msg = 2; ///错误信息
}
